# v0.2 DaemonSet (sibling-container model per ADR-0018):
#   - obi    : upstream OBI image; privileged (CAP_BPF, hostPID, host
#              mounts); does the eBPF capture; emits OTLP to localhost.
#   - agent  : our image; unprivileged; OTLP receiver + OBI config writer.
# The two share the pod network namespace (loopback OTLP) and an
# emptyDir at /etc/ollie/obi-config/ for the agent-written OBI config.
#
# Image references use bare names; ap deploy adds the registry prefix.
# No imagePullPolicy (repo convention).

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollie
        app.kubernetes.io/component: agent
    spec:
      hostPID: true  # used only by the obi container
      containers:
        # Sibling OBI container: privileged, eBPF capture, OTLP -> localhost.
        - name: obi
          # Pinned per ADR-0010 / ADR-0018 (image tag, not Go module).
          # Upstream OBI publishes to Docker Hub at otel/ebpf-instrument,
          # not GHCR.
          image: otel/ebpf-instrument:v0.9.0
          args:
            - --config=/etc/ollie/obi-config/config.yaml
          env:
            # OBI v0.9+ refuses to start without explicit feature flags.
            # `network`     = L4 TCP metrics (ModuleL4TCP).
            # `application` = L7 HTTP/gRPC spans and metrics
            #                 (ModuleHTTP1/2/GRPC).
            # `stats` (OBI's own self-obs) is intentionally omitted —
            # the agent has its own ollie_capture_* counters.
            - name: OTEL_EBPF_METRICS_FEATURES
              value: "network,application"
            # OBI's HTTP exporter requires a real URL (host:port alone
            # parses as scheme:path and is rejected). Point at the
            # agent's loopback OTLP HTTP listener.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://127.0.0.1:4318"
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 300Mi
          securityContext:
            capabilities:
              add:
                - BPF        # load eBPF programs and create maps
                - PERFMON    # perf events, ringbuffers
                - NET_ADMIN  # several BPF program types (e.g. socket-filter
                             # registration via SO_ATTACH_BPF)
                - NET_RAW    # raw-socket access; OBI requires this for its
                             # network-mode socket filter (warned explicitly
                             # at startup if absent)
                - SYS_ADMIN  # required by some BPF map operations and uprobe
                             # attach paths on kernels that haven't fully
                             # split the cap (Kind nodes share the host
                             # kernel — Docker Desktop / older GKE host
                             # kernels often still gate BPF object loads
                             # behind SYS_ADMIN). Acceptable here because
                             # OBI's container is the only place we accept
                             # this; the agent container stays unprivileged.
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0  # eBPF load needs uid 0 in the user namespace
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: obi-config
              mountPath: /etc/ollie/obi-config

        # Agent container: unprivileged; OTLP receiver + OBI config writer.
        - name: agent
          image: ollie
          args:
            - --otlp-grpc-addr=127.0.0.1:4317
            - --otlp-http-addr=127.0.0.1:4318
            - --obi-config=/etc/ollie/obi-config/config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 300m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: obi-config
              mountPath: /etc/ollie/obi-config

      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: obi-config
          emptyDir: {}
