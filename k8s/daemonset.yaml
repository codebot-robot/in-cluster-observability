# v0.1 DaemonSet: the agent runs unprivileged because no eBPF is wired
# yet (capture lands in v0.2). CAP_BPF / hostPID / host mounts arrive
# alongside real capture per docs/design/data-plane.md §9.
# Image is the bare name "ollie"; ap deploy adds the registry
# prefix per repo convention. No imagePullPolicy (also per convention).

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollie
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: ollie
          args:
            - --stay-alive
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
