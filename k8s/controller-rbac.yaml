# RBAC for the v0.4 ollie-controller (per ADR-0022 + control-plane.md §7).
#
# The controller reconciles TrafficMonitor + ClusterTrafficPolicy CRDs
# and Pods into per-pod MonitoringSpecs, then streams them to agents
# via the gRPC AgentSession bidirectional RPC. Permissions match the
# documented v0.4 scope:
#
#   - CRDs we own       — read + status patch.
#   - Pods + Nodes      — read for selector resolution.
#   - Leases            — full mutate for leader election.
#   - Events            — create/patch for operator-facing emission.
#
# v0.4 scope cuts (per ADR-0022.5): no services or endpointslices —
# those were for the deferred identity informer; no Roles/RoleBindings
# — the controller is namespaced to ollie-system but its watch scope
# is cluster-wide.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollie-controller
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-controller
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
rules:
  # Our CRDs.
  - apiGroups: ["ollie.gke-labs.dev"]
    resources: ["trafficmonitors", "clustertrafficpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ollie.gke-labs.dev"]
    resources: ["trafficmonitors/status", "clustertrafficpolicies/status"]
    verbs: ["update", "patch"]
  # Pod + Node read — selector resolution.
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  # Leader election (Lease).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event emission for operator visibility.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-controller
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-controller
subjects:
  - kind: ServiceAccount
    name: ollie-controller
    namespace: ollie-system
